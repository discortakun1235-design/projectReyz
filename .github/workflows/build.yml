name: Build with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: gradle build

    - name: Upload Plugin JAR
      uses: actions/upload-artifact@v3
      with:
        name: GuardiansValler-Plugin
        path: build/libs/GuardiansValler-1.0.jar
